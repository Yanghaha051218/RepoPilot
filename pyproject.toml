[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "repopilot"
version = "0.1.0"
description = "Budget-aware repository exploration for coding agents"
requires-python = ">=3.9"
dependencies = []
[project.scripts]
repopilot = "repopilot.cli:main"
[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
